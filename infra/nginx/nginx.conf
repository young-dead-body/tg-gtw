user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # Map for WebSocket proxying (used by the Telegram reverse proxy in S10).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Static Telegram Web assets (hashed, immutable URLs) cached locally so
    # transient upstream failures over the SOCKS5 egress never break the UI.
    proxy_cache_path /var/cache/nginx/tg_static levels=1:2 keys_zone=tg_static:10m
                     max_size=512m inactive=7d use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}

# DC WebSocket is handled by the authenticated /tg/_gw/dc/ HTTP route.
