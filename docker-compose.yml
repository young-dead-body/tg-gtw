x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/install.sh}
      POSTGRES_DB: ${POSTGRES_DB:-telegram_gateway}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tg} -d ${POSTGRES_DB:-telegram_gateway}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  migrate:
    build: ./api
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-tg}:${POSTGRES_PASSWORD:?Run ./scripts/install.sh}@postgres:5432/${POSTGRES_DB:-telegram_gateway}
      RUN_MIGRATIONS: "1"
      MIGRATE_EXPECT_DB: ${POSTGRES_DB:-telegram_gateway}
      TG_BOT_ENABLED: ${TG_BOT_ENABLED:-false}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    logging: *logging

  api:
    build: ./api
    environment:
      PORT: 8080
      POSTGRES_DSN: postgres://${POSTGRES_USER:-tg}:${POSTGRES_PASSWORD:?Run ./scripts/install.sh}@postgres:5432/${POSTGRES_DB:-telegram_gateway}
      REDIS_ADDR: redis:6379
      BOT_TOKEN: ${BOT_API_TOKEN:?Run ./scripts/install.sh}
      GATEWAY_URL: https://${DOMAIN:?Set DOMAIN in .env}
      TG_BOT_ENABLED: ${TG_BOT_ENABLED:-false}
      TELEGRAM_PROXY_ADDR: telegram-proxy:8080
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_CRON_INTERVAL: ${BACKUP_CRON_INTERVAL:-24h}
      CLEANUP_CRON_INTERVAL: ${CLEANUP_CRON_INTERVAL:-24h}
      CLEANUP_REQUEST_AGE: ${CLEANUP_REQUEST_AGE:-720h}
      ARCHIVE_CRON_INTERVAL: ${ARCHIVE_CRON_INTERVAL:-24h}
      ARCHIVE_LOG_AGE: ${ARCHIVE_LOG_AGE:-2160h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes: [backups:/backups]
    ports: ["127.0.0.1:18090:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging

  bot:
    profiles: [bot]
    build: ./bot
    environment:
      TELEGRAM_BOT_TOKEN: ${BOT_TOKEN:-}
      API_TOKEN: ${BOT_API_TOKEN:?Run ./scripts/install.sh}
      API_URL: http://api:8080
      REDIS_ADDR: redis:6379
      EVENTS_CHANNEL: gateway:events
      TG_BOT_ENABLED: ${TG_BOT_ENABLED:-false}
      HTTPS_PROXY: ${BOT_HTTPS_PROXY:-}
      NO_PROXY: api,localhost,127.0.0.1
    depends_on:
      api: {condition: service_started}
    restart: unless-stopped
    logging: *logging

  web:
    build: ./web
    depends_on: [api]
    restart: unless-stopped
    logging: *logging

  telegram-proxy:
    build:
      context: ./api
      dockerfile: Dockerfile.proxy
    environment:
      PROXY_ADDR: :8080
      POSTGRES_DSN: postgres://${POSTGRES_USER:-tg}:${POSTGRES_PASSWORD:?Run ./scripts/install.sh}@postgres:5432/${POSTGRES_DB:-telegram_gateway}
      REDIS_ADDR: redis:6379
      SOCKS5_ADDR: ${SOCKS5_ADDR:-}
      TURN_ADDR: ${TURN_ADDR:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    environment:
      NGINX_ENVSUBST_FILTER: API_UPSTREAM|WEB_UPSTREAM|TG_UPSTREAM|TLS_CERT|TLS_KEY
      API_UPSTREAM: api:8080
      WEB_UPSTREAM: web:80
      TG_UPSTREAM: telegram-proxy:8080
      TLS_CERT: /etc/nginx/certs/server.crt
      TLS_KEY: /etc/nginx/certs/server.key
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./infra/certbot:/var/www/certbot:ro
    depends_on: [api, web, telegram-proxy]
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  backups:
